name: Deployment checklist

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to create a checklist for (e.g. v3.4.1)
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: deployment-checklist-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  checklist:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Open the release deployment checklist
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v\d+\.\d+\.\d+$/.test(tag)) {
              throw new Error('Expected a stable release tag such as v3.4.1');
            }
            const repo = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag });
            if (release.draft || release.prerelease) {
              core.info('Deployment checklists are only created for published stable releases.');
              return;
            }
            const marker = `<!-- deployment-release:${release.id} -->`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...repo, state: 'all', per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.body?.includes(marker));
            if (existing) {
              core.info(`Preserving existing deployment checklist: ${existing.html_url}`);
              return;
            }
            const { data: commit } = await github.rest.repos.getCommit({ ...repo, ref: tag });
            const { data: template } = await github.rest.repos.getContent({
              ...repo, path: '.github/ISSUE_TEMPLATE/release.md', ref: commit.sha
            });
            const checklist = Buffer.from(template.content, 'base64').toString('utf8');
            const body = [
              marker,
              `Release: [${tag}](${release.html_url})`,
              `Source commit: [${commit.sha}](${commit.html_url})`,
              'Complete this checklist with the deployment owner. Publishing a release does not confirm a deployment.',
              checklist
            ].join('\n\n');
            const { data: issue } = await github.rest.issues.create({
              ...repo, title: `Deploy RAMS ${tag}`, body
            });
            core.info(`Created deployment checklist: ${issue.html_url}`);
