inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rails
  - rubocop-performance

# Rails' omakase style (https://github.com/rails/rubocop-rails-omakase) is the
# base: it turns every department off and opts back into a curated set of
# style/layout cops. The correctness departments below are re-enabled on top of
# it so the checks this codebase already passes stay enforced.
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  # Matches .ruby-version / Gemfile. RuboCop >= 1.84 and rubocop-ast >= 1.49
  # support the 4.0 target with the Prism backend.
  TargetRubyVersion: 4.0
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - 'bin/*'
    - 'db/schema.rb'
    - 'db/seeds.rb'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'

# Keep linting focused on correctness: omakase handles style, these four
# departments catch bugs and security problems.
Lint:
  Enabled: true

Security:
  Enabled: true

Rails:
  Enabled: true

Metrics:
  Enabled: true

Metrics/AbcSize:
  Enabled: false

Metrics/BlockLength:
  Max: 80
  Exclude:
    - 'config/routes.rb'
    - 'config/environments/*.rb'
    - 'config/initializers/*.rb'
    - 'spec/**/*.rb'

Metrics/ClassLength:
  Max: 300

Metrics/CyclomaticComplexity:
  Max: 40

Metrics/MethodLength:
  Max: 50
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']

Metrics/ModuleLength:
  Max: 300

Metrics/ParameterLists:
  Max: 8
  CountKeywordArgs: false

Metrics/PerceivedComplexity:
  Max: 40

# Too noisy for this codebase as a starting point; revisit later.
Lint/UselessAssignment:
  Enabled: false

Rails/PluralizationGrammar:
  Enabled: false

# Legacy migrations often intentionally violate these style-focused cops.
Rails/BulkChangeTable:
  Exclude:
    - 'db/migrate/*.rb'

Rails/CreateTableWithTimestamps:
  Exclude:
    - 'db/migrate/*.rb'

Rails/ReversibleMigration:
  Exclude:
    - 'db/migrate/*.rb'

Rails/UnknownEnv:
  Environments:
    - development
    - test
    - production
    - dev_server
    - staging
