---
openapi: 3.0.1
info:
  title: RAMS API
  version: v1
  description: |
    Read-only JSON API for UC Natural Reserve System research projects.

    All endpoints require a Bearer token issued to an `ApiClient`. A client
    may be scoped to a single reserve; scoping only narrows what a client
    can read. See `docs/api.md` for how to create and rotate clients.
  license:
    name: MIT
    url: https://github.com/UCNRS-RAMS/ucnrs-rams/blob/main/LICENSE.md
paths:
  "/api/v1/institutions":
    get:
      summary: List institutions
      tags:
      - Institutions
      operationId: listInstitutions
      description: Returns the institutions visible to the authenticated client, newest
        first.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page number (defaults to 1).
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
        description: Items per page (defaults to 25, capped at 100).
      - name: institution_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - university_of_california
          - california_state_university_system
          - california_community_college
          - other_california_university_or_college
          - non_california_us_university_or_college
          - international_university_or_college
          - k_12_education
          - non_governmental_organization_or_entity
          - governmental_organization_or_entity
          - business_entity
          - individual_or_other_entity
        description: Filter by institution type. An unknown value returns 400.
      - name: country_code
        in: query
        required: false
        schema:
          type: string
          minLength: 2
          maxLength: 2
        description: Filter by country, as an ISO 3166-1 alpha-2 code such as "US".
          An unknown code returns 400.
      - name: state_code
        in: query
        required: false
        schema:
          type: string
        description: Filter by state or province within country_code. State codes
          are not unique across countries, so state_code without country_code, or
          one naming no state in that country, returns 400.
      responses:
        '200':
          description: institutions visible to the client
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InstitutionsCollection"
        '400':
          description: a rejected filter value
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: missing, malformed, unknown, or deactivated token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/institutions/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      description: RAMS institution ID.
    get:
      summary: Show an institution
      tags:
      - Institutions
      operationId: showInstitution
      description: Returns a single institution. An institution outside the client's
        scope returns 404.
      responses:
        '200':
          description: the requested institution
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InstitutionResource"
        '404':
          description: unknown institution, or one outside the client scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/projects":
    get:
      summary: List projects
      tags:
      - Projects
      operationId: listProjects
      description: Returns the projects visible to the authenticated client, newest
        first.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: Page number (defaults to 1).
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
        description: Items per page (defaults to 25, capped at 100).
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - open
          - closed
          - incomplete
        description: Filter by status. An unknown value returns 400.
      - name: project_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - research
          - class
          - meeting
          - public_use
          - housing
        description: Filter by project type. An unknown value returns 400.
      - name: reserve_id
        in: query
        required: false
        schema:
          type: integer
        description: Restrict to one reserve, within the client's scope.
      responses:
        '200':
          description: projects visible to the client
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectsCollection"
        '400':
          description: an unknown status or project_type filter
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '401':
          description: missing, malformed, unknown, or deactivated token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/api/v1/projects/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      description: RAMS project ID.
    get:
      summary: Show a project
      tags:
      - Projects
      operationId: showProject
      description: Returns a single project. A project outside the client's scope
        returns 404.
      responses:
        '200':
          description: the requested project
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectResource"
        '404':
          description: unknown project, or one outside the client scope
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
servers:
- url: "/"
security:
- bearerAuth: []
tags:
- name: Projects
  description: Research, class, meeting, public use, and housing projects.
- name: Institutions
  description: Organizations the people on a project are affiliated with.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        Requests must send `Authorization: Bearer <token>`, where `<token>`
        is an `ApiClient` token. In Swagger UI, click Authorize and paste
        the token without the `Bearer ` prefix. Tokens are shown once when
        a client is created or rotated, for example with
        `bin/rails api:clients:create NAME="My integration"`.
  schemas:
    Project:
      type: object
      required:
      - id
      - type
      - title
      - status
      - project_type
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
          - projects
        title:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - open
          - closed
          - incomplete
          description: Rails enum key.
        project_type:
          type: string
          enum:
          - research
          - class
          - meeting
          - public_use
          - housing
          description: Rails enum key.
        abstract:
          type: string
          nullable: true
        discipline:
          type: string
          nullable: true
        discipline_other:
          type: string
          nullable: true
        keywords:
          type: string
          nullable: true
        taxonomic_keywords:
          type: string
          nullable: true
        thesis_title:
          type: string
          nullable: true
        course_title:
          type: string
          nullable: true
        course_number:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        submitted_at:
          type: string
          format: date-time
          nullable: true
        reserve:
          type: object
          nullable: true
          allOf:
          - "$ref": "#/components/schemas/ReserveStub"
        owner:
          type: object
          nullable: true
          allOf:
          - "$ref": "#/components/schemas/UserStub"
        applicant:
          type: object
          nullable: true
          allOf:
          - "$ref": "#/components/schemas/UserStub"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ReserveStub:
      type: object
      required:
      - type
      - id
      - name
      - short_name
      properties:
        type:
          type: string
          enum:
          - reserves
        id:
          type: integer
        name:
          type: string
        short_name:
          type: string
          nullable: true
    UserStub:
      type: object
      required:
      - type
      - id
      - full_name
      - orcid
      properties:
        type:
          type: string
          enum:
          - users
        id:
          type: integer
        full_name:
          type: string
        orcid:
          type: string
          nullable: true
    Institution:
      type: object
      required:
      - id
      - type
      - name
      - institution_type
      properties:
        id:
          type: integer
        type:
          type: string
          enum:
          - institutions
        name:
          type: string
        acronym:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        institution_type:
          type: string
          enum:
          - university_of_california
          - california_state_university_system
          - california_community_college
          - other_california_university_or_college
          - non_california_us_university_or_college
          - international_university_or_college
          - k_12_education
          - non_governmental_organization_or_entity
          - governmental_organization_or_entity
          - business_entity
          - individual_or_other_entity
          description: Rails enum key.
        country:
          type: object
          nullable: true
          allOf:
          - "$ref": "#/components/schemas/CountryStub"
        state:
          type: object
          nullable: true
          allOf:
          - "$ref": "#/components/schemas/StateStub"
        ror:
          type: object
          nullable: true
          allOf:
          - "$ref": "#/components/schemas/RorStub"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CountryStub:
      type: object
      required:
      - type
      - id
      - code
      - name
      properties:
        type:
          type: string
          enum:
          - countries
        id:
          type: integer
        code:
          type: string
          nullable: true
          description: ISO 3166-1 alpha-2 code, and the value +country_code+ filters
            accept.
        name:
          type: string
    StateStub:
      type: object
      required:
      - type
      - id
      - code
      - name
      properties:
        type:
          type: string
          enum:
          - states
        id:
          type: integer
        code:
          type: string
          nullable: true
          description: State or province code within its country, and the value +state_code+
            filters accept.
        name:
          type: string
          nullable: true
    RorStub:
      type: object
      required:
      - type
      - id
      - ror_id
      - name
      properties:
        type:
          type: string
          enum:
          - rors
        id:
          type: integer
        ror_id:
          type: string
          description: Research Organization Registry identifier.
        name:
          type: string
          nullable: true
    ProjectsCollection:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Project"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    ProjectResource:
      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/Project"
    InstitutionsCollection:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Institution"
        meta:
          "$ref": "#/components/schemas/PaginationMeta"
    InstitutionResource:
      type: object
      required:
      - data
      properties:
        data:
          "$ref": "#/components/schemas/Institution"
    PaginationMeta:
      type: object
      required:
      - page
      - per_page
      - total_pages
      - total_count
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total_pages:
          type: integer
        total_count:
          type: integer
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - unauthorized
          - not_found
          - bad_request
        detail:
          type: string
          nullable: true
          description: Present on 400 responses, explaining the rejected value.
